name: Déployer sur GitHub Pages

# Publie le site statique à chaque mise à jour de `main` (ou à la demande).
# Seuls les fichiers du site sont publiés : les documents de travail
# (PRODUCT.md, DESIGN.md, .impeccable/, .claude/) ne sont jamais servis.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assembler le site (fichiers publics uniquement)
        run: |
          mkdir _site
          cp -r index.html favicon.svg css js assets vendor _site/
          rm -f _site/assets/img/*.json
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
